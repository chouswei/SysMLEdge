name: p1-runtime
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: pin fixtures/memnet-session.map SHA256
        run: sha256sum -c memnet-session.map.sha256
        working-directory: fixtures
      - run: npm test
      - run: npm run typecheck
      - run: npm run bind:smoke
